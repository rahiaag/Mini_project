<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: beige;
            margin:2px;
            padding:2px;
            border:3px solid black;
            display: flex;
        }
        .box{
            height: 100px;
            width:100px;
            margin:2px;
            padding:2px;
            border:1px solid brown;
        }
        #box1{
            background-color: purple;
        }
        #box2{
            background-color: olive;
        }
        #box3{
            background-color: yellowgreen;
        }
        #box4{
            background-color:red;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
    </div>
</body>
</html>

<!--Div elements with background colors don’t appear by default because they have no size. To make them visible, you need to give them a width and height (or add content inside). Without size, the div collapses to 0 × 0 pixels, so the background color cannot be seen.”-->
