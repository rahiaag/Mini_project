        <form>
            <legend><b>Event Registration</b></legend>
            <br/>
            <label for="name">Name</label>
            <input type="text" id="name">
            <br/><br/>
            <label for ="Email">Email</label>
            <input type="email" id="Email">
            <br/><br/>
            <label for ="phone">Phone</label>
            <input type="number" id="phone">
            <br/><br/>
            <label for="resumt">Resume</label>
            <br/>
            <input type="file" id="resume">
            <br/><br/>
            <label for="occupation">Occupation</label>
            <br/><br/>
            <select id="occupation">
                <option></option>
                <option value="Software Engineer">Software Engineer</option>
                <option value="Backend Engineer">Backend Engineer</option>
                <option value="Java Developer">Java Developer</option>
            </select>
            <br/>
            <br/>
            <fieldset>
            <legend>Topic of Interest:</legend>
            <br/>
            <input type="checkbox" id="html">
            <label for="html">HTML</label>
            <br/>
            <input type="checkbox" id="css">
            <label for="css">CSS</label>
            <br/>
            <input type="checkbox" id="js">
            <label for="js">JavaScript</label>
            </fieldset>
            <br/>
            <legend>Availability</legend>
            <label for="fulltime">Full Time</label>   <!--If you want only 1 radio button to get clicked then put their name attribute same-->
            <input type="radio" id="fulltime">
            <br/><br/>
            <label for="parttime">Part Time</label>
            <input type="radio" id="fulltime">
            <br/><br/>
            <legend>Comments</legend>
            <textarea rows="5" cols="50" placeholder="Leave you comments"></textarea>
            <br/><br/>
            <button type="Submit">Register</button>


        </form>
